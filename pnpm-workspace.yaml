# Single-package repo; this file exists for pnpm settings.
packages:
  - '.'

# pnpm 10 blocks dependency build scripts unless allowlisted:
# argon2 / esbuild compile or fetch their native binaries on install.
# (@dawned/shared arrives as file:../Dawned/packages/shared with dist prebuilt
# by the game repo — no build script needed here.)
onlyBuiltDependencies:
  - argon2
  - esbuild
