name: check

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Auth + world-settings integration tests run against a real database,
    # exactly like the VPS (game repo docs/tech/DATABASE.md).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dawned
          POSTGRES_PASSWORD: dawned
          POSTGRES_DB: dawned
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dawned"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://dawned:dawned@127.0.0.1:5432/dawned

    defaults:
      run:
        working-directory: Dawned-Admin

    steps:
      # Sibling layout, exactly like dev machines and the VPS: @dawned/shared is
      # consumed as file:../Dawned/packages/shared from the game checkout.
      - uses: actions/checkout@v4
        with:
          path: Dawned-Admin

      # The game repo is private — DAWNED_SHARED_TOKEN is a fine-grained PAT
      # with Contents: Read-only on EinPallux/Dawned.
      - uses: actions/checkout@v4
        with:
          repository: EinPallux/Dawned
          token: ${{ secrets.DAWNED_SHARED_TOKEN }}
          path: Dawned

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: Dawned-Admin/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build @dawned/shared (game repo)
        working-directory: Dawned
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @dawned/shared build

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply game schema (migrations shipped in @dawned/shared)
        run: node tools/ci/migrate.mjs

      # typecheck + lint + format + tests (incl. DB integration)
      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build
